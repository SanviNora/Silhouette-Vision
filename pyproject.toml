[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silhouette-vision"
version = "0.1.0"
description = "Fashion product intelligence and visual search with multimodal embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.25",
    "joblib>=1.4",
    "numpy>=2.0",
    "open-clip-torch>=2.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "plotly>=5.24",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "streamlit>=1.40",
    "timm>=1.0",
    "torch>=2.4",
    "transformers>=4.44",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Only for fetching raw data (Kaggle datasets, the Visuelle MEGA link).
data = [
    "cryptography>=43.0",
    "kaggle>=1.6",
    "requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: downloads and runs the real Marqo model (skipped in CI)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
